name: One-off CVPR 2023 canonical URL and title audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-cvpr-2023-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill CVPR 2023 canonical URLs and normalize one title
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          tax_path = Path('data/paper_taxonomy.csv')
          old_title = '3D Registration with Maximal Cliques'
          new_title = '3D Registration With Maximal Cliques'
          urls = {
              'Planning-Oriented Autonomous Driving': 'https://openaccess.thecvf.com/content/CVPR2023/html/Hu_Planning-Oriented_Autonomous_Driving_CVPR_2023_paper.html',
              'Visual Programming: Compositional Visual Reasoning Without Training': 'https://openaccess.thecvf.com/content/CVPR2023/html/Gupta_Visual_Programming_Compositional_Visual_Reasoning_Without_Training_CVPR_2023_paper.html',
              'DynIBaR: Neural Dynamic Image-Based Rendering': 'https://openaccess.thecvf.com/content/CVPR2023/html/Li_DynIBaR_Neural_Dynamic_Image-Based_Rendering_CVPR_2023_paper.html',
              new_title: 'https://openaccess.thecvf.com/content/CVPR2023/html/Zhang_3D_Registration_With_Maximal_Cliques_CVPR_2023_paper.html',
              'DreamBooth: Fine Tuning Text-to-Image Diffusion Models for Subject-Driven Generation': 'https://openaccess.thecvf.com/content/CVPR2023/html/Ruiz_DreamBooth_Fine_Tuning_Text-to-Image_Diffusion_Models_for_Subject-Driven_Generation_CVPR_2023_paper.html',
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))
          papers = read(papers_path)
          tax = read(tax_path)
          p = [r for r in papers if r['venue']=='CVPR' and r['year']=='2023' and r['title']==old_title]
          t = [r for r in tax if r['venue']=='CVPR' and r['year']=='2023' and r['title']==old_title]
          if len(p)!=1 or len(t)!=1:
              raise SystemExit(f'Expected one title correction target, got {len(p)}/{len(t)}')
          p[0]['title']=new_title
          t[0]['title']=new_title

          folded={k.casefold():v for k,v in urls.items()}
          found=set()
          for row in papers:
              if row['venue']!='CVPR' or row['year']!='2023':
                  continue
              key=row['title'].casefold()
              if key not in folded:
                  continue
              row['paper_url']=folded[key]
              row['checked_at']='2026-10-07'
              found.add(key)
          if found != set(folded):
              raise SystemExit(f'Missing target rows: {sorted(set(folded)-found)}')

          with papers_path.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'],lineterminator='\n')
              w.writeheader(); w.writerows(papers)
          with tax_path.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['venue','year','title','area','task','model_family'],lineterminator='\n')
              w.writeheader(); w.writerows(tax)
          subprocess.run([sys.executable,'scripts/validate_catalog.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py','--check'],check=True)
          PY
      - name: Commit canonical URLs and title correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Audit CVPR 2023 paper links and title'
            git push
          fi
