name: One-off ACL 2021 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit ACL 2021 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Apply curated correction
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/papers/acl.csv')
          title='Mind Your Outliers! Investigating the Negative Impact of Outliers on Active Learning for Visual Question Answering'
          with path.open(newline='',encoding='utf-8') as f:
            rows=list(csv.DictReader(f)); fields=list(rows[0])
          matches=[r for r in rows if r['year']=='2021' and r['title']==title]
          if len(matches)!=1: raise RuntimeError(f'Expected one target, found {len(matches)}')
          r=matches[0]
          for field,val in {'task':'Evaluation & Benchmarking','model_family':'Theory / Analysis'}.items():
            print(f'{field}: {r[field]} -> {val}'); r[field]=val
          with path.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint
      - name: Commit audit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/acl.csv README.md
          git commit -m "Audit ACL 2021 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
