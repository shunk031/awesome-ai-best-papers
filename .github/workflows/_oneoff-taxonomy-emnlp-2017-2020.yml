name: One-off EMNLP 2017-2020 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit EMNLP 2017-2020 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Apply curated corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/papers/emnlp.csv')
          changes={
            ('2020','Spot The Bot: A Robust and Efficient Framework for the Evaluation of Conversational Dialogue Systems'):{
              'task':'Evaluation & Benchmarking','model_family':'Theory / Analysis'},
            ('2017','Bringing Structure into Summaries: Crowdsourcing a Benchmark Corpus of Concept Maps.'):{
              'title':'Bringing Structure into Summaries: Crowdsourcing a Benchmark Corpus of Concept Maps','task':'Evaluation & Benchmarking'},
            ('2017','Natural Language Does Not Emerge ‘Naturally’ in Multi-Agent Dialog.'):{
              'title':'Natural Language Does Not Emerge ‘Naturally’ in Multi-Agent Dialog','area':'Reinforcement Learning & Decision Making','task':'Reinforcement Learning & Planning'},
          }
          with path.open(newline='',encoding='utf-8') as f:
            rows=list(csv.DictReader(f)); fields=list(rows[0])
          seen=set()
          for r in rows:
            k=(r['year'],r['title'])
            if k in changes:
              for field,val in changes[k].items():
                print(f'{k}: {field}: {r[field]} -> {val}'); r[field]=val
              seen.add(k)
          if seen != set(changes): raise RuntimeError(f'Missing targets: {set(changes)-seen}')
          with path.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint
      - name: Commit audit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/emnlp.csv README.md
          git commit -m "Audit EMNLP 2017-2020 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
