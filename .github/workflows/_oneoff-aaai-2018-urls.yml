name: One-off AAAI 2018 canonical URL and title audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2018-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill AAAI 2018 canonical URLs and normalize titles
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          tax_path = Path('data/paper_taxonomy.csv')
          corrections = {
              'Counterfactual Multi-Agent Policy Gradients.': 'Counterfactual Multi-Agent Policy Gradients',
              'Generalized Adjustment under Confounding and Selection Biases.': 'Generalized Adjustment Under Confounding and Selection Biases',
              'Adapting a Kidney Exchange Algorithm to Align with Human Values.': 'Adapting a Kidney Exchange Algorithm to Align With Human Values',
          }
          urls = {
              'Memory-Augmented Monte Carlo Tree Search': 'https://ojs.aaai.org/index.php/AAAI/article/view/11531',
              'Counterfactual Multi-Agent Policy Gradients': 'https://ojs.aaai.org/index.php/AAAI/article/view/11794',
              'Generalized Adjustment Under Confounding and Selection Biases': 'https://ojs.aaai.org/index.php/AAAI/article/view/12125',
              'Adapting a Kidney Exchange Algorithm to Align With Human Values': 'https://ojs.aaai.org/index.php/AAAI/article/view/11505',
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          papers = read(papers_path)
          tax = read(tax_path)

          for old, new in corrections.items():
              p = [r for r in papers if r['venue']=='AAAI' and r['year']=='2018' and r['title']==old]
              t = [r for r in tax if r['venue']=='AAAI' and r['year']=='2018' and r['title']==old]
              if len(p) != 1 or len(t) != 1:
                  raise SystemExit(f'Expected one old-title paper/tax row for {old!r}; got {len(p)}/{len(t)}')
              p[0]['title'] = new
              t[0]['title'] = new

          folded = {k.casefold(): v for k, v in urls.items()}
          found = set()
          for row in papers:
              if row['venue'] != 'AAAI' or row['year'] != '2018':
                  continue
              key = row['title'].casefold()
              if key not in folded:
                  continue
              canonical = folded[key]
              if row['paper_url'] not in ('', canonical):
                  raise SystemExit(f'Unexpected existing URL for {row["title"]}: {row["paper_url"]}')
              row['paper_url'] = canonical
              row['checked_at'] = '2026-10-07'
              found.add(key)
          if set(folded) != found:
              raise SystemExit(f'Missing target rows: {sorted(set(folded)-found)}')

          with papers_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(papers)
          with tax_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','title','area','task','model_family'], lineterminator='\n')
              w.writeheader(); w.writerows(tax)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs and title corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Audit AAAI 2018 paper links and titles'
            git push
          fi
