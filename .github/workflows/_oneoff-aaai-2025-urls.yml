name: One-off AAAI 2025 canonical URLs

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2025-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - name: Fill AAAI 2025 canonical paper URLs
        run: |
          uv sync --frozen
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Efficient Rectification of Neuro-Symbolic Reasoning Inconsistencies by Abductive Reflection': 'https://ojs.aaai.org/index.php/AAAI/article/view/33905',
              'Every Bit Helps: Achieving the Optimal Distortion with a Few Queries': 'https://ojs.aaai.org/index.php/AAAI/article/view/33507',
              'Revelations: A Decidable Class of POMDPs with Omega-Regular Objectives': 'https://ojs.aaai.org/index.php/AAAI/article/view/34845',
              'DivShift: Exploring Domain-Specific Distribution Shifts in Large-Scale, Volunteer-Collected Biodiversity Datasets': 'https://ojs.aaai.org/index.php/AAAI/article/view/35060',
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          fields = ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes']

          seen = set()
          for row in rows:
              if row['venue'] == 'AAAI' and row['year'] == '2025' and row['title'] in urls:
                  row['paper_url'] = urls[row['title']]
                  row['checked_at'] = '2026-10-07'
                  seen.add(row['title'])

          missing = set(urls) - seen
          if missing:
              raise SystemExit(f'AAAI 2025 rows not found: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add AAAI 2025 canonical paper URLs'
            git push
          fi
