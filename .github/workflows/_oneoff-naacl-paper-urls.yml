name: One-off NAACL canonical paper URLs

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-naacl-paper-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Fill NAACL ACL Anthology paper URLs
        run: |
          python - <<'PY'
          import csv
          import re
          import subprocess
          import sys
          import time
          import unicodedata
          import urllib.request
          from collections import defaultdict
          from html.parser import HTMLParser
          from pathlib import Path

          PAPERS = Path('data/papers.csv')
          USER_AGENT = 'awesome-ai-best-papers catalog audit/1.0'

          def norm(text):
              text = unicodedata.normalize('NFKC', text).casefold()
              text = re.sub(r'[^\w]+', ' ', text, flags=re.UNICODE)
              return ' '.join(text.split())

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.href = None
                  self.buf = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href')
                      self.buf = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      text = ''.join(self.buf).strip()
                      href = self.href
                      if text and re.match(r'^/(?:[A-Z]\d{2}-\d{4}|\d{4}\.[^/]+)/$', href):
                          self.links.append((text, 'https://aclanthology.org' + href))
                      self.href = None
                      self.buf = []

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8')

          with PAPERS.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          fields = ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes']
          targets = [r for r in rows if r['venue'] == 'NAACL' and not r['paper_url']]
          before = len(targets)
          by_year = defaultdict(list)
          for r in targets:
              by_year[r['year']].append(r)

          filled = 0
          unmatched = []
          ambiguous = []
          for year in sorted(by_year):
              url = f'https://aclanthology.org/events/naacl-{year}/'
              try:
                  html = fetch(url)
              except Exception as exc:
                  print(f'WARN: failed to fetch {url}: {exc}', file=sys.stderr)
                  unmatched.extend((year, r['title']) for r in by_year[year])
                  continue
              parser = LinkParser(); parser.feed(html)
              index = defaultdict(list)
              for title, paper_url in parser.links:
                  index[norm(title)].append(paper_url)
              for row in by_year[year]:
                  matches = sorted(set(index.get(norm(row['title']), [])))
                  if len(matches) == 1:
                      row['paper_url'] = matches[0]
                      row['checked_at'] = '2026-10-07'
                      filled += 1
                  elif not matches:
                      unmatched.append((year, row['title']))
                  else:
                      ambiguous.append((year, row['title'], matches))
              time.sleep(0.2)

          with PAPERS.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          print(f'NAACL blank paper_url before: {before}')
          print(f'NAACL canonical URLs filled: {filled}')
          print(f'NAACL unmatched: {len(unmatched)}')
          for year, title in unmatched:
              print(f'UNMATCHED {year}: {title}')
          print(f'NAACL ambiguous: {len(ambiguous)}')
          for year, title, matches in ambiguous:
              print(f'AMBIGUOUS {year}: {title} -> {matches}')
          if unmatched or ambiguous:
              raise SystemExit('NAACL canonical URL audit left unresolved rows')

          subprocess.run(['uv', 'sync'], check=True)
          subprocess.run(['uv', 'run', 'python', 'scripts/validate_catalog.py'], check=True)
          subprocess.run(['uv', 'run', 'python', 'scripts/generate_readme.py'], check=True)
          subprocess.run(['uv', 'run', 'python', 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add canonical NAACL paper URLs'
            git push
          fi
