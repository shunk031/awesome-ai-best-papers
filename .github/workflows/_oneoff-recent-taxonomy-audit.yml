name: One-off recent taxonomy audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-recent-taxonomy-audit.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-backed recent taxonomy corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/paper_taxonomy.csv')
          corrections = {
              ('AAAI','2026','Model Change for Description Logic Concepts'): {
                  'task': 'Reasoning & Knowledge',
              },
              ('ICCV','2025','FlowEdit: Inversion-Free Text-Based Editing Using Pre-Trained Flow Models'): {
                  'model_family': 'Diffusion; Neural Model',
              },
              ('CVPR','2026','ChordEdit: One-Step Low-Energy Transport for Image Editing'): {
                  'model_family': 'Diffusion; Optimization',
              },
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          found = set()
          for row in rows:
              key = (row['venue'], row['year'], row['title'])
              if key in corrections:
                  row.update(corrections[key])
                  found.add(key)
          missing = set(corrections) - found
          if missing:
              raise SystemExit(f'Missing taxonomy rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','title','area','task','model_family'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit taxonomy corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Audit recent paper taxonomy'
            git push
          fi
