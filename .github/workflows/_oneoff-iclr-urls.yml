name: One-off ICLR URL audit

on:
  push:
    branches:
      - audit/iclr-canonical-urls

permissions:
  contents: write

jobs:
  fill-iclr-urls:
    if: ${{ !contains(github.event.head_commit.message, 'Fill canonical ICLR paper URLs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/iclr-canonical-urls
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply verified ICLR paper URLs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          PAPERS = Path('data/papers.csv')
          TAXONOMY = Path('data/paper_taxonomy.csv')

          # Verified against ICLR award/proceedings pages and OpenReview records.
          # ICLR 2016 conference-track papers predate the current OpenReview proceedings
          # convention, so their canonical arXiv records are used as stable fallbacks.
          URLS = {
              (2025, 'AlphaEdit: Null-Space Constrained Model Editing for Language Models'):
                  ('AlphaEdit: Null-Space Constrained Knowledge Editing for Language Models', 'https://openreview.net/forum?id=HvSytvg3Jh'),
              (2025, 'Learning Dynamics of LLM Finetuning'):
                  ('Learning Dynamics of LLM Finetuning', 'https://openreview.net/forum?id=tPNHOoZFl9'),
              (2025, 'Safety Alignment Should be Made More Than Just a Few Tokens Deep'):
                  ('Safety Alignment Should be Made More Than Just a Few Tokens Deep', 'https://openreview.net/forum?id=6Mxhg9PtDE'),
              (2024, 'Generalization in diffusion models arises from geometry-adaptive harmonic representations'):
                  ('Generalization in diffusion models arises from geometry-adaptive harmonic representations', 'https://openreview.net/forum?id=ANvmVS2Yr0'),
              (2024, 'Learning Interactive Real-World Simulators'):
                  ('Learning Interactive Real-World Simulators', 'https://openreview.net/forum?id=sFyTZEqmUY'),
              (2024, 'Never Train from Scratch: Fair Comparison of Long-Sequence Models Requires Data-Driven Priors'):
                  ('Never Train from Scratch: Fair Comparison of Long-Sequence Models Requires Data-Driven Priors', 'https://openreview.net/forum?id=PdaPky8MUn'),
              (2024, 'Protein Discovery with Discrete Walk-Jump Sampling'):
                  ('Protein Discovery with Discrete Walk-Jump Sampling', 'https://openreview.net/forum?id=zMPHKOmQNb'),
              (2024, 'Vision Transformers Need Registers'):
                  ('Vision Transformers Need Registers', 'https://openreview.net/forum?id=2dnO3LLiJ1'),
              (2023, 'DreamFusion: Text-to-3D using 2D Diffusion'):
                  ('DreamFusion: Text-to-3D using 2D Diffusion', 'https://openreview.net/forum?id=FjNys5c7VyY'),
              (2023, 'Emergence of Maps in the Memories of Blind Navigation Agents'):
                  ('Emergence of Maps in the Memories of Blind Navigation Agents', 'https://openreview.net/forum?id=lTt4KjHSsyl'),
              (2023, 'Rethinking the Expressive Power of GNNs via Graph Biconnectivity'):
                  ('Rethinking the Expressive Power of GNNs via Graph Biconnectivity', 'https://openreview.net/forum?id=r9hNv76KoT3'),
              (2023, 'Universal Few-shot Learning of Dense Prediction Tasks with Visual Token Matching'):
                  ('Universal Few-shot Learning of Dense Prediction Tasks with Visual Token Matching', 'https://openreview.net/forum?id=88nT0j5jAn'),
              (2022, 'Analytic-DPM: an Analytic Estimate of the Optimal Reverse Variance in Diffusion Probabilistic Models'):
                  ('Analytic-DPM: an Analytic Estimate of the Optimal Reverse Variance in Diffusion Probabilistic Models', 'https://openreview.net/forum?id=0xiJLKH-ufZ'),
              (2022, 'Bootstrapped Meta-Learning'):
                  ('Bootstrapped Meta-Learning', 'https://openreview.net/forum?id=b-ny3x071E5'),
              (2022, 'Comparing Distributions by Measuring Differences that Affect Decision Making'):
                  ('Comparing Distributions by Measuring Differences that Affect Decision Making', 'https://openreview.net/forum?id=KB5onONJIAU'),
              (2022, 'Expressiveness and Approximation Properties of Graph Neural Networks'):
                  ('Expressiveness and Approximation Properties of Graph Neural Networks', 'https://openreview.net/forum?id=wIzUeM3TAU'),
              (2022, 'Hyperparameter Tuning with Renyi Differential Privacy'):
                  ('Hyperparameter Tuning with Renyi Differential Privacy', 'https://openreview.net/forum?id=-70L8lpp9DF'),
              (2022, 'Learning Strides in Convolutional Neural Networks'):
                  ('Learning Strides in Convolutional Neural Networks', 'https://openreview.net/forum?id=M752z9FKJP'),
              (2022, 'Neural Collapse Under MSE Loss: Proximity to and Dynamics on the Central Path'):
                  ('Neural Collapse Under MSE Loss: Proximity to and Dynamics on the Central Path', 'https://openreview.net/forum?id=w1UbdvWH_R3'),
              (2021, 'Beyond Fully-Connected Layers with Quaternions: Parameterization of Hypercomplex Multiplications with 1/n Parameters'):
                  ('Beyond Fully-Connected Layers with Quaternions: Parameterization of Hypercomplex Multiplications with 1/n Parameters', 'https://openreview.net/forum?id=hfqKk2GM81'),
              (2021, 'Complex Query Answering with Neural Link Predictors'):
                  ('Complex Query Answering with Neural Link Predictors', 'https://openreview.net/forum?id=Mos9F9kDwkz'),
              (2021, 'EigenGame: PCA as a Nash Equilibrium'):
                  ('EigenGame: PCA as a Nash Equilibrium', 'https://openreview.net/forum?id=NzTU59SYbNq'),
              (2021, 'Learning Mesh-Based Simulation with Graph Networks'):
                  ('Learning Mesh-Based Simulation with Graph Networks', 'https://openreview.net/forum?id=roNqYL0_XP'),
              (2021, 'Neural Synthesis of Binaural Speech from Mono Audio'):
                  ('Neural Synthesis of Binaural Speech from Mono Audio', 'https://openreview.net/forum?id=uAX8q61EVRu'),
              (2021, 'Optimal Rates for Averaged Stochastic Gradient Descent under Neural Tangent Kernel Regime'):
                  ('Optimal Rates for Averaged Stochastic Gradient Descent under Neural Tangent Kernel Regime', 'https://openreview.net/forum?id=PULSD5qI2N1'),
              (2021, 'Rethinking Architecture Selection in Differentiable NAS'):
                  ('Rethinking Architecture Selection in Differentiable NAS', 'https://openreview.net/forum?id=PKubaeJkw3'),
              (2021, 'Score-Based Generative Modeling through Stochastic Differential Equations'):
                  ('Score-Based Generative Modeling through Stochastic Differential Equations', 'https://openreview.net/forum?id=PxTIG12RRHS'),
              (2019, 'Ordered Neurons: Integrating Tree Structures into Recurrent Neural Networks'):
                  ('Ordered Neurons: Integrating Tree Structures into Recurrent Neural Networks', 'https://openreview.net/forum?id=B116qiR5F7'),
              (2019, 'The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks'):
                  ('The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks', 'https://openreview.net/forum?id=rJl-b3RcF7'),
              (2018, 'Continuous Adaptation via Meta-Learning in Nonstationary and Competitive Environments'):
                  ('Continuous Adaptation via Meta-Learning in Nonstationary and Competitive Environments', 'https://openreview.net/forum?id=Sk2u1g-0-'),
              (2018, 'On the Convergence of Adam and Beyond'):
                  ('On the Convergence of Adam and Beyond', 'https://openreview.net/forum?id=ryQu7f-RZ'),
              (2018, 'Spherical CNNs'):
                  ('Spherical CNNs', 'https://openreview.net/forum?id=Hkbd5xZRb'),
              (2017, 'Making Neural Programming Architectures Generalize via Recursion'):
                  ('Making Neural Programming Architectures Generalize via Recursion', 'https://openreview.net/forum?id=BkbY4psgg'),
              (2017, 'Semi-supervised Knowledge Transfer for Deep Learning from Private Training Data'):
                  ('Semi-supervised Knowledge Transfer for Deep Learning from Private Training Data', 'https://openreview.net/forum?id=HkwoSDPgg'),
              (2017, 'Understanding Deep Learning Requires Rethinking Generalization'):
                  ('Understanding Deep Learning Requires Rethinking Generalization', 'https://openreview.net/forum?id=Sy8gdB9xx'),
              (2016, 'Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding'):
                  ('Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding', 'https://arxiv.org/abs/1510.00149'),
              (2016, 'Neural Programmer-Interpreters'):
                  ('Neural Programmer-Interpreters', 'https://arxiv.org/abs/1511.06279'),
          }

          with PAPERS.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())

          targets = [r for r in rows if r['venue'] == 'ICLR' and not r['paper_url'].strip()]
          print(f'ICLR missing before: {len(targets)}')
          if len(targets) != 37:
              raise RuntimeError(f'Expected 37 missing ICLR URLs on audited base, found {len(targets)}')

          observed = {(int(r['year']), r['title']) for r in targets}
          expected = set(URLS)
          if observed != expected:
              missing_mapping = sorted(observed - expected)
              stale_mapping = sorted(expected - observed)
              raise RuntimeError(f'ICLR mapping mismatch; missing={missing_mapping}; stale={stale_mapping}')

          title_changes = {}
          for r in targets:
              key = (int(r['year']), r['title'])
              new_title, url = URLS[key]
              if not url.startswith('https://'):
                  raise RuntimeError(f'Non-HTTPS URL for {key}: {url}')
              if int(r['year']) >= 2017 and not url.startswith('https://openreview.net/forum?id='):
                  raise RuntimeError(f'Expected OpenReview URL for {key}: {url}')
              if new_title != r['title']:
                  title_changes[(r['venue'], r['year'], r['title'])] = new_title
              r['title'] = new_title
              r['paper_url'] = url
              print(f"{r['year']} | {r['title']} -> {url}")

          with PAPERS.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(rows)

          with TAXONOMY.open(newline='', encoding='utf-8') as f:
              tax_rows = list(csv.DictReader(f))
              tax_fields = list(tax_rows[0].keys())
          changed_tax = 0
          for r in tax_rows:
              key = (r['venue'], r['year'], r['title'])
              if key in title_changes:
                  r['title'] = title_changes[key]
                  changed_tax += 1
          if changed_tax != len(title_changes) or changed_tax != 1:
              raise RuntimeError(f'Expected exactly one taxonomy title update, got {changed_tax}')
          with TAXONOMY.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=tax_fields, lineterminator='\n')
              w.writeheader()
              w.writerows(tax_rows)

          with PAPERS.open(newline='', encoding='utf-8') as f:
              after = list(csv.DictReader(f))
          remaining = [r for r in after if r['venue'] == 'ICLR' and not r['paper_url'].strip()]
          if remaining:
              raise RuntimeError(f'ICLR missing URLs remain: {len(remaining)}')
          print(f'ICLR missing after: {len(remaining)}')
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check

      - name: Commit audited data
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.csv data/paper_taxonomy.csv README.md
          git commit -m "Fill canonical ICLR paper URLs"
          git push origin HEAD:audit/iclr-canonical-urls
