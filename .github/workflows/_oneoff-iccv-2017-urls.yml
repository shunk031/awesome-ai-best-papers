name: One-off ICCV 2017 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-iccv-2017-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill ICCV 2017 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')

          updates = {
              'Mask R-CNN': (
                  'Mask R-CNN',
                  'https://openaccess.thecvf.com/content_iccv_2017/html/He_Mask_R-CNN_ICCV_2017_paper.html',
              ),
              'Focal Loss for Dense Object Detection.': (
                  'Focal Loss for Dense Object Detection',
                  'https://openaccess.thecvf.com/content_iccv_2017/html/Lin_Focal_Loss_for_ICCV_2017_paper.html',
              ),
              'First Person Activity Forecasting with Online Inverse Reinforcement Learning.': (
                  'First-Person Activity Forecasting With Online Inverse Reinforcement Learning',
                  'https://openaccess.thecvf.com/content_ICCV_2017/papers/Rhinehart_First-Person_Activity_Forecasting_ICCV_2017_paper.pdf',
              ),
              'Globally-Optimal Inlier Set Maximisation for Simultaneous Camera Pose and Feature Correspondence.': (
                  'Globally-Optimal Inlier Set Maximisation for Simultaneous Camera Pose and Feature Correspondence',
                  'https://openaccess.thecvf.com/content_ICCV_2017/papers/Campbell_Globally-Optimal_Inlier_Set_ICCV_2017_paper.pdf',
              ),
              'Open Set Domain Adaptation.': (
                  'Open Set Domain Adaptation',
                  'https://openaccess.thecvf.com/content_iccv_2017/html/Busto_Open_Set_Domain_ICCV_2017_paper.html',
              ),
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          papers = read(papers_path)
          taxonomy = read(taxonomy_path)
          found = set()

          for row in papers:
              if row['venue'] != 'ICCV' or row['year'] != '2017' or row['title'] not in updates:
                  continue
              old_title = row['title']
              new_title, url = updates[old_title]
              row['title'] = new_title
              row['paper_url'] = url
              row['checked_at'] = '2026-10-07'
              found.add(old_title)

          if found != set(updates):
              raise SystemExit(f'Missing paper targets: {sorted(set(updates) - found)}')

          tax_found = set()
          for row in taxonomy:
              if row['venue'] != 'ICCV' or row['year'] != '2017' or row['title'] not in updates:
                  continue
              old_title = row['title']
              row['title'] = updates[old_title][0]
              tax_found.add(old_title)

          if tax_found != set(updates):
              raise SystemExit(f'Missing taxonomy targets: {sorted(set(updates) - tax_found)}')

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, taxonomy, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill ICCV 2017 canonical paper URLs'
            git push
          fi
