name: One-off ACL 2024-2026 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit ACL 2024-2026 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply curated taxonomy and title corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/papers/acl.csv')
          changes = {
              ('2024', 'Causal Estimation of Memorisation Profiles'): {
                  'area': 'NLP & Language',
                  'task': 'Causal Learning',
                  'model_family': 'LLM; Transformer; Theory / Analysis',
              },
              ('2024', 'Natural Language Satisfiability'): {
                  'title': 'Natural Language Satisfiability: Exploring the Problem Distribution and Evaluating Transformer-based Language Models',
                  'model_family': 'Transformer; Theory / Analysis',
              },
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0])

          seen = set()
          for row in rows:
              key = (row['year'], row['title'])
              if key not in changes:
                  continue
              for field, value in changes[key].items():
                  print(f'{key}: {field}: {row[field]} -> {value}')
                  row[field] = value
              seen.add(key)

          missing = set(changes) - seen
          if missing:
              raise RuntimeError(f'Missing target rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint

      - name: Commit taxonomy audit
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/acl.csv README.md
          git commit -m "Audit ACL 2024-2026 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
