name: One-off ICCV 2025 canonical URLs

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-iccv-2025-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill ICCV-25 Open Access URLs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Generating Physically Stable and Buildable Brick Structures from Text': 'https://openaccess.thecvf.com/content/ICCV2025/html/Pun_Generating_Physically_Stable_and_Buildable_Brick_Structures_from_Text_ICCV_2025_paper.html',
              'FlowEdit: Inversion-Free Text-Based Editing Using Pre-Trained Flow Models': 'https://openaccess.thecvf.com/content/ICCV2025/html/Kulikov_FlowEdit_Inversion-Free_Text-Based_Editing_Using_Pre-Trained_Flow_Models_ICCV_2025_paper.html',
              'RayZer: A Self-supervised Large View Synthesis Model': 'https://openaccess.thecvf.com/content/ICCV2025/html/Jiang_RayZer_A_Self-supervised_Large_View_Synthesis_Model_ICCV_2025_paper.html',
              'Spatially-Varying Autofocus': 'https://openaccess.thecvf.com/content/ICCV2025/html/Qin_Spatially-Varying_Autofocus_ICCV_2025_paper.html',
          }
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          found = set()
          for row in rows:
              if row['venue']=='ICCV' and row['year']=='2025' and row['title'] in urls:
                  row['paper_url'] = urls[row['title']]
                  row['checked_at'] = '2026-10-07'
                  found.add(row['title'])
          missing = set(urls) - found
          if missing:
              raise SystemExit(f'Missing ICCV-25 rows: {sorted(missing)}')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add ICCV 2025 canonical paper URLs'
            git push
          fi
