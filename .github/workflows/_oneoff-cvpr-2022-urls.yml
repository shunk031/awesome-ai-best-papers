name: One-off CVPR 2022 canonical URL and title audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-cvpr-2022-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill CVPR 2022 canonical URLs and normalize titles
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path=Path('data/papers.csv')
          tax_path=Path('data/paper_taxonomy.csv')
          corrections={
              'Learning to Solve Hard Minimal Problems':'Learning To Solve Hard Minimal Problems',
              'EPro-PnP: Generalized End-to-End Probabilistic Perspective-n-Points for Monocular Object Pose Estimation':'EPro-PnP: Generalized End-to-End Probabilistic Perspective-N-Points for Monocular Object Pose Estimation',
          }
          urls={
              'Learning To Solve Hard Minimal Problems':'https://openaccess.thecvf.com/content/CVPR2022/html/Hruby_Learning_To_Solve_Hard_Minimal_Problems_CVPR_2022_paper.html',
              'EPro-PnP: Generalized End-to-End Probabilistic Perspective-N-Points for Monocular Object Pose Estimation':'https://openaccess.thecvf.com/content/CVPR2022/html/Chen_EPro-PnP_Generalized_End-to-End_Probabilistic_Perspective-N-Points_for_Monocular_Object_Pose_Estimation_CVPR_2022_paper.html',
              'Dual-Shutter Optical Vibration Sensing':'https://openaccess.thecvf.com/content/CVPR2022/html/Sheinin_Dual-Shutter_Optical_Vibration_Sensing_CVPR_2022_paper.html',
              'Ref-NeRF: Structured View-Dependent Appearance for Neural Radiance Fields':'https://openaccess.thecvf.com/content/CVPR2022/html/Verbin_Ref-NeRF_Structured_View-Dependent_Appearance_for_Neural_Radiance_Fields_CVPR_2022_paper.html',
          }
          def read(p):
              with p.open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          papers=read(papers_path); tax=read(tax_path)
          for old,new in corrections.items():
              p=[r for r in papers if r['venue']=='CVPR' and r['year']=='2022' and r['title']==old]
              t=[r for r in tax if r['venue']=='CVPR' and r['year']=='2022' and r['title']==old]
              if len(p)!=1 or len(t)!=1: raise SystemExit(f'Correction target mismatch {old}: {len(p)}/{len(t)}')
              p[0]['title']=new; t[0]['title']=new
          folded={k.casefold():v for k,v in urls.items()}; found=set()
          for r in papers:
              if r['venue']!='CVPR' or r['year']!='2022':continue
              k=r['title'].casefold()
              if k in folded:
                  r['paper_url']=folded[k]; r['checked_at']='2026-10-07'; found.add(k)
          if found!=set(folded):raise SystemExit(f'Missing targets {sorted(set(folded)-found)}')
          with papers_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'],lineterminator='\n');w.writeheader();w.writerows(papers)
          with tax_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['venue','year','title','area','task','model_family'],lineterminator='\n');w.writeheader();w.writerows(tax)
          subprocess.run([sys.executable,'scripts/validate_catalog.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py','--check'],check=True)
          PY
      - name: Commit canonical URLs and title corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then echo 'No changes to commit'; else git commit -m 'Audit CVPR 2022 paper links and titles'; git push; fi
