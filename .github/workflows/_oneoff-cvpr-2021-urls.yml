name: One-off CVPR 2021 canonical URL and title audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-cvpr-2021-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill CVPR 2021 canonical URLs and normalize titles
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          tax_path = Path('data/paper_taxonomy.csv')
          corrections = {
              'GIRAFFE: Representing Scenes as Compositional Generative Neural Feature Fields': 'GIRAFFE: Representing Scenes As Compositional Generative Neural Feature Fields',
              'Less is More: ClipBERT for Video-and-Language Learning via Sparse Sampling': 'Less Is More: ClipBERT for Video-and-Language Learning via Sparse Sampling',
          }
          urls = {
              'GIRAFFE: Representing Scenes As Compositional Generative Neural Feature Fields': 'https://openaccess.thecvf.com/content/CVPR2021/html/Niemeyer_GIRAFFE_Representing_Scenes_As_Compositional_Generative_Neural_Feature_Fields_CVPR_2021_paper.html',
              'Task Programming: Learning Data Efficient Behavior Representations': 'https://openaccess.thecvf.com/content/CVPR2021/html/Sun_Task_Programming_Learning_Data_Efficient_Behavior_Representations_CVPR_2021_paper.html',
              'Exploring Simple Siamese Representation Learning': 'https://openaccess.thecvf.com/content/CVPR2021/html/Chen_Exploring_Simple_Siamese_Representation_Learning_CVPR_2021_paper.html',
              'Learning High Fidelity Depths of Dressed Humans by Watching Social Media Dance Videos': 'https://openaccess.thecvf.com/content/CVPR2021/html/Jafarian_Learning_High_Fidelity_Depths_of_Dressed_Humans_by_Watching_Social_CVPR_2021_paper.html',
              'Less Is More: ClipBERT for Video-and-Language Learning via Sparse Sampling': 'https://openaccess.thecvf.com/content/CVPR2021/html/Lei_Less_Is_More_ClipBERT_for_Video-and-Language_Learning_via_Sparse_Sampling_CVPR_2021_paper.html',
              'Binary TTC: A Temporal Geofence for Autonomous Navigation': 'https://openaccess.thecvf.com/content/CVPR2021/html/Badki_Binary_TTC_A_Temporal_Geofence_for_Autonomous_Navigation_CVPR_2021_paper.html',
              'Real-Time High-Resolution Background Matting': 'https://openaccess.thecvf.com/content/CVPR2021/html/Lin_Real-Time_High-Resolution_Background_Matting_CVPR_2021_paper.html',
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          papers = read(papers_path)
          tax = read(tax_path)
          for old, new in corrections.items():
              p = [r for r in papers if r['venue']=='CVPR' and r['year']=='2021' and r['title']==old]
              t = [r for r in tax if r['venue']=='CVPR' and r['year']=='2021' and r['title']==old]
              if len(p) != 1 or len(t) != 1:
                  raise SystemExit(f'Correction target mismatch {old}: {len(p)}/{len(t)}')
              p[0]['title'] = new
              t[0]['title'] = new

          folded = {k.casefold(): v for k, v in urls.items()}
          found = set()
          for row in papers:
              if row['venue'] != 'CVPR' or row['year'] != '2021':
                  continue
              key = row['title'].casefold()
              if key not in folded:
                  continue
              row['paper_url'] = folded[key]
              row['checked_at'] = '2026-10-07'
              found.add(key)
          if found != set(folded):
              raise SystemExit(f'Missing targets: {sorted(set(folded)-found)}')

          with papers_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(papers)
          with tax_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','title','area','task','model_family'], lineterminator='\n')
              w.writeheader(); w.writerows(tax)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs and title corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Audit CVPR 2021 paper links and titles'
            git push
          fi
