name: One-off ICML 2026 main paper awards

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-icml-2026-main-awards.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete ICML-26 main paper awards and URLs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')
          source = 'https://blog.icml.cc/2026/07/05/announcing-the-icml-2026-awards/'

          canonical = {
              'The Flexibility Trap: Rethinking the Value of Arbitrary Order in Diffusion Language Models': 'https://proceedings.mlr.press/v306/ni26e.html',
              'High-Accuracy Sampling for Diffusion Models and Log-Concave Distributions': 'https://proceedings.mlr.press/v306/chen26p.html',
              'The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes': 'https://proceedings.mlr.press/v306/taufeeque26a.html',
              'Motion Attribution for Video Generation': 'https://proceedings.mlr.press/v306/wu26aq.html',
              'How much can language models memorize?': 'https://proceedings.mlr.press/v306/morris26a.html',
              'A Random Matrix Theory Perspective on the Consistency of Diffusion Models': 'https://proceedings.mlr.press/v306/wang26kf.html',
              'To Grok Grokking: Provable Grokking in Ridge Regression': 'https://proceedings.mlr.press/v306/xu26bd.html',
          }

          additions = [
              ('The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes', 'Responsible AI & Privacy', 'Safety, Fairness & Privacy', 'LLM; RL; Theory / Analysis'),
              ('Motion Attribution for Video Generation', 'Computer Vision', 'Image & Video Generation', 'Diffusion; Neural Model'),
              ('How much can language models memorize?', 'NLP & Language', 'LLM Analysis & Evaluation', 'LLM; Transformer; Theory / Analysis'),
              ('A Random Matrix Theory Perspective on the Consistency of Diffusion Models', 'ML Theory & Optimization', 'Generative Modeling', 'Diffusion; Theory / Analysis'),
              ('To Grok Grokking: Provable Grokking in Ridge Regression', 'ML Theory & Optimization', 'Optimization & Generalization', 'Optimization; Theory / Analysis'),
          ]

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          papers = read(papers_path)
          tax = read(taxonomy_path)
          paper_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in papers}
          tax_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in tax}

          # Canonicalize the two already-cataloged Outstanding Papers.
          for row in papers:
              if row['venue']=='ICML' and row['year']=='2026' and row['title'] in canonical:
                  row['paper_url'] = canonical[row['title']]
                  row['source_url'] = source
                  row['checked_at'] = '2026-10-07'

          for title, area, task, family in additions:
              key = ('ICML', '2026', title.casefold())
              if key not in paper_keys:
                  row = {
                      'venue':'ICML','year':'2026','award':'Outstanding Paper Honorable Mention','tier':'secondary',
                      'title':title,'paper_url':canonical[title],'source_url':source,'checked_at':'2026-10-07','notes':''
                  }
                  same = [i for i,r in enumerate(papers) if r['venue']=='ICML' and r['year']=='2026']
                  papers.insert(max(same)+1, row)
                  paper_keys.add(key)
              if key not in tax_keys:
                  row = {'venue':'ICML','year':'2026','title':title,'area':area,'task':task,'model_family':family}
                  same = [i for i,r in enumerate(tax) if r['venue']=='ICML' and r['year']=='2026']
                  tax.insert(max(same)+1, row)
                  tax_keys.add(key)

          # Verify all seven main Outstanding/HM records are present with PMLR URLs.
          matched = [r for r in papers if r['venue']=='ICML' and r['year']=='2026' and r['title'] in canonical]
          if len(matched) != 7 or any(r['paper_url'] != canonical[r['title']] for r in matched):
              raise SystemExit(f'ICML-26 canonicalization mismatch: {len(matched)} records')

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, tax, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit audited catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Complete ICML 2026 main paper awards'
            git push
          fi
