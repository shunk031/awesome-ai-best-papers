name: One-off ACL 2017 canonical title audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-titles:
    if: ${{ !contains(github.event.head_commit.message, 'Audit ACL 2017 canonical titles') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Match ACL Anthology citation titles
        run: |
          python - <<'PY'
          import csv, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.title=None
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='meta' and d.get('name')=='citation_title': self.title=d.get('content')
          path=Path('data/papers/acl.csv')
          with path.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0])
          changed=0
          for r in rows:
              if r['year']!='2017' or not r['title'].endswith('.') or 'aclanthology.org/' not in r['paper_url']: continue
              req=urllib.request.Request(r['paper_url'],headers={'User-Agent':'awesome-ai-best-papers-title-audit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as resp: html=resp.read().decode('utf-8')
              p=P(); p.feed(html); canonical=(p.title or '').strip()
              if not canonical: raise RuntimeError(f'No citation_title for {r["paper_url"]}')
              if r['title'][:-1] != canonical: raise RuntimeError(f'Non-trivial mismatch: {r["title"]!r} vs {canonical!r}')
              print(f'{r["title"]} -> {canonical}'); r['title']=canonical; changed+=1
          if changed != 22: raise RuntimeError(f'Expected 22 safe ACL 2017 fixes, got {changed}')
          with path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint
      - name: Commit audit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/acl.csv README.md
          git commit -m "Audit ACL 2017 canonical titles"
          git push origin HEAD:refactor/venue-csv-catalog
