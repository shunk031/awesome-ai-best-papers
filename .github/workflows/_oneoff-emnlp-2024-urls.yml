name: One-off EMNLP 2024 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-emnlp-2024-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill EMNLP 2024 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'An image speaks a thousand words, but can everyone listen? On image transcreation for cultural relevance': 'https://aclanthology.org/2024.emnlp-main.573/',
              'Backward Lens: Projecting Language Model Gradients into the Vocabulary Space': 'https://aclanthology.org/2024.emnlp-main.142/',
              'CoGen: Learning from Feedback with Coupled Comprehension and Generation': 'https://aclanthology.org/2024.emnlp-main.721/',
              'Pretraining Data Detection for Large Language Models: A Divergence-based Calibration Method': 'https://aclanthology.org/2024.emnlp-main.300/',
              'Towards Robust Speech Representation Learning for Thousands of Languages': 'https://aclanthology.org/2024.emnlp-main.570/',
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          found = set()
          for row in rows:
              if row['venue'] == 'EMNLP' and row['year'] == '2024' and row['title'] in urls:
                  row['paper_url'] = urls[row['title']]
                  row['checked_at'] = '2026-10-07'
                  found.add(row['title'])
          if found != set(urls):
              raise SystemExit(f'Missing targets: {sorted(set(urls)-found)}')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill EMNLP 2024 canonical paper URLs'
            git push
          fi
