name: One-off AAAI 2023 canonical URLs

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2023-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - name: Fill AAAI 2023 canonical paper URLs
        run: |
          uv sync --frozen
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Misspecification in Inverse Reinforcement Learning': 'https://ojs.aaai.org/index.php/AAAI/article/view/26766',
              'DropMessage: Unifying Random Dropping for Graph Neural Networks': 'https://ojs.aaai.org/index.php/AAAI/article/view/25545',
              'Two Heads are Better than One: Image-Point Cloud Network for Depth-Based 3D Hand Pose Estimation': 'https://ojs.aaai.org/index.php/AAAI/article/view/25310',
              'Neural Architecture Search for Wide Spectrum Adversarial Robustness': 'https://ojs.aaai.org/index.php/AAAI/article/view/25118',
              'CowClip: Reducing CTR Prediction Model Training Time from 12 hours to 10 minutes on 1 GPU': 'https://ojs.aaai.org/index.php/AAAI/article/view/26347',
              'DICNet: Deep Instance-Level Contrastive Network for Double Incomplete Multi-View Multi-Label Classification': 'https://ojs.aaai.org/index.php/AAAI/article/view/26059',
              'Exploring Tuning Characteristics of Ventral Stream’s Neurons for Few-Shot Image Classification': 'https://ojs.aaai.org/index.php/AAAI/article/view/25128',
              'MaskBooster: End-to-End Self-Training for Sparsely Supervised Instance Segmentation': 'https://ojs.aaai.org/index.php/AAAI/article/view/25481',
              'SimFair: A Unified Framework for Fairness-Aware Multi-Label Classification': 'https://ojs.aaai.org/index.php/AAAI/article/view/26677',
              'XRand: Differentially Private Defense against Explanation-Guided Attacks': 'https://ojs.aaai.org/index.php/AAAI/article/view/26401',
              'Clustering What Matters: Optimal Approximation for Clustering with Outliers': 'https://ojs.aaai.org/index.php/AAAI/article/view/25818',
              'Robust Average-Reward Markov Decision Processes': 'https://ojs.aaai.org/index.php/AAAI/article/view/26775',
              'Efficient Answer Enumeration in Description Logics with Functional Roles': 'https://ojs.aaai.org/index.php/AAAI/article/view/25797',
              'Decorate the Newcomers: Visual Domain Prompt for Continual Test Time Adaptation': 'https://ojs.aaai.org/index.php/AAAI/article/view/25922',
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          fields = ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes']

          seen = set()
          for row in rows:
              if row['venue'] == 'AAAI' and row['year'] == '2023' and row['title'] in urls:
                  row['paper_url'] = urls[row['title']]
                  row['checked_at'] = '2026-10-07'
                  seen.add(row['title'])

          missing = set(urls) - seen
          if missing:
              raise SystemExit(f'AAAI 2023 rows not found: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add AAAI 2023 canonical paper URLs'
            git push
          fi
