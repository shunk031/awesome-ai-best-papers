name: One-off CVPR 2024 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-cvpr-2024-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill CVPR 2024 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Generative Image Dynamics': 'https://openaccess.thecvf.com/content/CVPR2024/html/Li_Generative_Image_Dynamics_CVPR_2024_paper.html',
              'Rich Human Feedback for Text-to-Image Generation': 'https://openaccess.thecvf.com/content/CVPR2024/html/Liang_Rich_Human_Feedback_for_Text-to-Image_Generation_CVPR_2024_paper.html',
              'EventPS: Real-Time Photometric Stereo Using an Event Camera': 'https://openaccess.thecvf.com/content/CVPR2024/html/Yu_EventPS_Real-Time_Photometric_Stereo_Using_an_Event_Camera_CVPR_2024_paper.html',
              'pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction': 'https://openaccess.thecvf.com/content/CVPR2024/html/Charatan_pixelSplat_3D_Gaussian_Splats_from_Image_Pairs_for_Scalable_Generalizable_CVPR_2024_paper.html',
              'Mip-Splatting: Alias-free 3D Gaussian Splatting': 'https://openaccess.thecvf.com/content/CVPR2024/html/Yu_Mip-Splatting_Alias-free_3D_Gaussian_Splatting_CVPR_2024_paper.html',
              'BioCLIP: A Vision Foundation Model for the Tree of Life': 'https://openaccess.thecvf.com/content/CVPR2024/html/Stevens_BioCLIP_A_Vision_Foundation_Model_for_the_Tree_of_Life_CVPR_2024_paper.html',
              'SpiderMatch: 3D Shape Matching with Global Optimality and Geometric Consistency': 'https://openaccess.thecvf.com/content/CVPR2024/html/Roetzer_SpiderMatch_3D_Shape_Matching_with_Global_Optimality_and_Geometric_Consistency_CVPR_2024_paper.html',
              'Image Processing GNN: Breaking Rigidity in Super-Resolution': 'https://openaccess.thecvf.com/content/CVPR2024/html/Tian_Image_Processing_GNN_Breaking_Rigidity_in_Super-Resolution_CVPR_2024_paper.html',
              'Objects as Volumes: A Stochastic Geometry View of Opaque Solids': 'https://openaccess.thecvf.com/content/CVPR2024/html/Miller_Objects_as_Volumes_A_Stochastic_Geometry_View_of_Opaque_Solids_CVPR_2024_paper.html',
              'Comparing the Decision-Making Mechanisms by Transformers and CNNs via Explanation Methods': 'https://openaccess.thecvf.com/content/CVPR2024/html/Jiang_Comparing_the_Decision-Making_Mechanisms_by_Transformers_and_CNNs_via_Explanation_CVPR_2024_paper.html',
          }
          folded = {k.casefold(): v for k,v in urls.items()}
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          found = set()
          for row in rows:
              if row['venue'] != 'CVPR' or row['year'] != '2024':
                  continue
              key = row['title'].casefold()
              if key not in folded:
                  continue
              row['paper_url'] = folded[key]
              row['checked_at'] = '2026-10-07'
              found.add(key)
          if found != set(folded):
              raise SystemExit(f'Missing target rows: {sorted(set(folded)-found)}')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable,'scripts/validate_catalog.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py'],check=True)
          subprocess.run([sys.executable,'scripts/generate_readme.py','--check'],check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill CVPR 2024 canonical paper URLs'
            git push
          fi
