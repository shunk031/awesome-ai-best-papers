name: One-off AAAI 2022 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2022-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill AAAI 2022 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Online Certification of Preference-based Fairness for Personalized Recommender Systems': 'https://ojs.aaai.org/index.php/AAAI/article/view/20606',
              'Bayesian Persuasion in Sequential Decision-Making': 'https://ojs.aaai.org/index.php/AAAI/article/view/20434',
              'Operator-Potential Heuristics for Symbolic Search': 'https://ojs.aaai.org/index.php/AAAI/article/view/21210',
              'AlphaHoldem: High-Performance Artificial Intelligence for Heads-Up No-Limit Poker via End-to-End Reinforcement Learning': 'https://ojs.aaai.org/index.php/AAAI/article/view/20394',
              'Certified Symmetry and Dominance Breaking for Combinatorial Optimisation': 'https://ojs.aaai.org/index.php/AAAI/article/view/20283',
              'Online Elicitation of Necessarily Optimal Matchings': 'https://ojs.aaai.org/index.php/AAAI/article/view/20451',
              'Sampling-Based Robust Control of Autonomous Systems with Non-Gaussian Noise': 'https://ojs.aaai.org/index.php/AAAI/article/view/21201',
              'Subset approximation of Pareto Regions with Bi-objective A*': 'https://ojs.aaai.org/index.php/AAAI/article/view/21276',
              'The SoftCumulative Constraint with Quadratic Penalty': 'https://ojs.aaai.org/index.php/AAAI/article/view/20296',
              'InfoLM: A New Metric to Evaluate Summarization & Data2Text Generation': 'https://ojs.aaai.org/index.php/AAAI/article/view/21299',
              'Compilation of Aggregates in ASP Systems': 'https://ojs.aaai.org/index.php/AAAI/article/view/20527',
              'Entropy estimation via normalizing flow': 'https://ojs.aaai.org/index.php/AAAI/article/view/21237',
          }
          folded = {k.casefold(): v for k, v in urls.items()}

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          found = set()
          for row in rows:
              if row['venue'] != 'AAAI' or row['year'] != '2022':
                  continue
              key = row['title'].casefold()
              if key not in folded:
                  continue
              canonical = folded[key]
              if row['paper_url'] not in ('', canonical):
                  raise SystemExit(f'Unexpected existing URL for {row["title"]}: {row["paper_url"]}')
              row['paper_url'] = canonical
              row['checked_at'] = '2026-10-07'
              found.add(key)

          missing = set(folded) - found
          if missing:
              raise SystemExit(f'Missing target rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill AAAI 2022 canonical paper URLs'
            git push
          fi
