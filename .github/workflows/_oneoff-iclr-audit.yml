name: One-off ICLR award audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-iclr-audit.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add missing ICLR honorable mentions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          sources = {
              '2023': 'https://blog.iclr.cc/2023/03/21/announcing-the-iclr-2023-outstanding-paper-award-recipients/',
              '2024': 'https://blog.iclr.cc/2024/05/06/iclr-2024-outstanding-paper-awards/',
              '2025': 'https://blog.iclr.cc/2025/04/22/announcing-the-outstanding-paper-awards-at-iclr-2025/',
              '2026': 'https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/',
          }

          additions = [
              ('2023','Towards Understanding Ensemble, Knowledge Distillation and Self-Distillation in Deep Learning','https://openreview.net/forum?id=Uuf2q9TfXGA','General ML & Representation Learning','Model Efficiency & Architecture','Neural Model; Theory / Analysis'),
              ('2023','Mastering the Game of No-Press Diplomacy via Human-Regularized Reinforcement Learning and Planning','https://openreview.net/forum?id=F61FwJTZhb','Reinforcement Learning & Decision Making','Reinforcement Learning & Planning','RL; Search / Planning'),
              ('2023','On the duality between contrastive and non-contrastive self-supervised learning','https://openreview.net/forum?id=kDEL91Dufpa','General ML & Representation Learning','Representation Learning','Representation Learning; Theory / Analysis'),
              ('2023','Conditional Antibody Design as 3D Equivariant Graph Translation','https://openreview.net/forum?id=LFHFQbjxIiP','Scientific ML & Applications','Scientific Discovery & Simulation','GNN; Neural Model'),
              ('2023','Disentanglement with Biological Constraints: A Theory of Functional Cell Types','https://openreview.net/forum?id=9Z_GfhZnGH','Scientific ML & Applications','Representation Learning','Neural Model; Theory / Analysis'),
              ('2024','Amortizing intractable inference in large language models','https://openreview.net/forum?id=Ouj6p4ca60','NLP & Language','Probabilistic Inference & Sampling','LLM; Probabilistic / Bayesian'),
              ('2024','Approximating Nash Equilibria in Normal-Form Games via Stochastic Optimization','https://openreview.net/forum?id=cc8h3I3V4E','ML Theory & Optimization','Optimization & Generalization','Optimization; Theory / Analysis'),
              ('2024','Beyond Weisfeiler-Lehman: A Quantitative Framework for GNN Expressiveness','https://openreview.net/forum?id=HSKaGOi7Ar','Graphs & Structured Learning','Graph & Structured Learning','GNN; Theory / Analysis'),
              ('2024','Flow Matching on General Geometries','https://openreview.net/forum?id=g7ohDlTITL','General ML & Representation Learning','Generative Modeling','Neural Model; Theory / Analysis'),
              ('2024','Is ImageNet worth 1 video? Learning strong image encoders from 1 long unlabelled video','https://openreview.net/forum?id=Yen1lGns2o','Computer Vision','Representation Learning','Representation Learning'),
              ('2024','Meta Continual Learning Revisited: Implicitly Enhancing Online Hessian Approximation via Variance Reduction','https://openreview.net/forum?id=TpD2aG1h0D','General ML & Representation Learning','Meta-Learning & Adaptation','Meta-Learning; Optimization'),
              ('2024','Model Tells You What to Discard: Adaptive KV Cache Compression for LLMs','https://openreview.net/forum?id=uNrFpDPMyo','NLP & Language','Model Efficiency & Architecture','LLM; Transformer'),
              ('2024','Proving Test Set Contamination in Black-Box Language Models','https://openreview.net/forum?id=KS8mIvetg2','NLP & Language','LLM Analysis & Evaluation','LLM; Theory / Analysis'),
              ('2024','Robust agents learn causal world models','https://openreview.net/forum?id=pOoKI3ouv1','Reinforcement Learning & Decision Making','Causal Learning','RL; Theory / Analysis'),
              ('2024','The mechanistic basis of data dependence and abrupt learning in an in-context classification task','https://openreview.net/forum?id=aN4Jf6Cx69','General ML & Representation Learning','Interpretability & Explainability','Theory / Analysis'),
              ('2024','Towards a statistical theory of data selection under weak supervision','https://openreview.net/forum?id=HhfcNgQn6p','ML Theory & Optimization','Optimization & Generalization','Theory / Analysis'),
              ('2025','Data Shapley in One Training Run','https://openreview.net/forum?id=HD6bWcj87Y','General ML & Representation Learning','Interpretability & Explainability','Theory / Analysis'),
              ('2025','SAM 2: Segment Anything in Images and Videos','https://openreview.net/forum?id=Ha6RTeWMd0','Computer Vision','Visual Recognition & Representation','Transformer'),
              ('2025','Faster Cascades via Speculative Decoding','https://openreview.net/forum?id=vo9t20wsmd','NLP & Language','Model Efficiency & Architecture','LLM; Transformer; Autoregressive'),
              ('2026','The Polar Express: Optimal Matrix Sign Methods and their Application to the Muon Algorithm','https://openreview.net/forum?id=yRtgZ1K8hO','ML Theory & Optimization','Optimization & Generalization','Optimization; Theory / Analysis'),
          ]

          papers = read(papers_path)
          tax = read(taxonomy_path)
          paper_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in papers}
          tax_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in tax}

          for year, title, paper_url, area, task, family in additions:
              key = ('ICLR', year, title.casefold())
              if key not in paper_keys:
                  row = {'venue':'ICLR','year':year,'award':'Outstanding Paper Honorable Mention','tier':'secondary','title':title,'paper_url':paper_url,'source_url':sources[year],'checked_at':'2026-10-07','notes':''}
                  insert_at = max(i for i,r in enumerate(papers) if r['venue']=='ICLR' and r['year']==year) + 1
                  papers.insert(insert_at, row)
                  paper_keys.add(key)
              if key not in tax_keys:
                  row = {'venue':'ICLR','year':year,'title':title,'area':area,'task':task,'model_family':family}
                  insert_at = max(i for i,r in enumerate(tax) if r['venue']=='ICLR' and r['year']==year) + 1
                  tax.insert(insert_at, row)
                  tax_keys.add(key)

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, tax, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit corrected catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Complete recent ICLR honorable mentions'
            git push
          fi
