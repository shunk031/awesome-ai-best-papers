name: One-off CVPR 2024-2026 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit CVPR 2024-2026 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply curated taxonomy corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/papers/cvpr.csv')
          changes = {
              ('2026', 'NitroGen: An Open Foundation Model for Generalist Gaming Agents'): {
                  'model_family': 'Transformer',
              },
              ('2025', 'Navigation World Models'): {
                  'task': 'Reinforcement Learning & Planning',
                  'model_family': 'Diffusion; Transformer; Search / Planning',
              },
              ('2024', 'Image Processing GNN: Breaking Rigidity in Super-Resolution'): {
                  'task': 'Image & Video Generation',
              },
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0])

          seen = set()
          for row in rows:
              key = (row['year'], row['title'])
              if key not in changes:
                  continue
              for field, value in changes[key].items():
                  print(f'{key}: {field}: {row[field]} -> {value}')
                  row[field] = value
              seen.add(key)

          missing = set(changes) - seen
          if missing:
              raise RuntimeError(f'Missing target rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint

      - name: Commit taxonomy audit
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/cvpr.csv README.md
          git commit -m "Audit CVPR 2024-2026 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
