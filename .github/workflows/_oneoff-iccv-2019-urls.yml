name: One-off ICCV 2019 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-iccv-2019-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill ICCV 2019 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')

          updates = {
              'SinGAN: Learning a Generative Model from a Single Natural Image': (
                  'SinGAN: Learning a Generative Model From a Single Natural Image',
                  'https://openaccess.thecvf.com/content_ICCV_2019/html/Shaham_SinGAN_Learning_a_Generative_Model_From_a_Single_Natural_Image_ICCV_2019_paper.html',
              ),
              'PLMP – Point-Line Minimal Problems in Complete Multi-View Visibility': (
                  'PLMP - Point-Line Minimal Problems in Complete Multi-View Visibility',
                  'https://openaccess.thecvf.com/content_ICCV_2019/papers/Duff_PLMP_-_Point-Line_Minimal_Problems_in_Complete_Multi-View_Visibility_ICCV_2019_paper.pdf',
              ),
              'Asynchronous Single-Photon 3D Imaging': (
                  'Asynchronous Single-Photon 3D Imaging',
                  'https://openaccess.thecvf.com/content_ICCV_2019/html/Gupta_Asynchronous_Single-Photon_3D_Imaging_ICCV_2019_paper.html',
              ),
              'Specifying Object Attributes and Relations in Interactive Scene Generation': (
                  'Specifying Object Attributes and Relations in Interactive Scene Generation',
                  'https://openaccess.thecvf.com/content_ICCV_2019/html/Ashual_Specifying_Object_Attributes_and_Relations_in_Interactive_Scene_Generation_ICCV_2019_paper.html',
              ),
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          papers = read(papers_path)
          taxonomy = read(taxonomy_path)
          found = set()
          for row in papers:
              if row['venue'] != 'ICCV' or row['year'] != '2019' or row['title'] not in updates:
                  continue
              old = row['title']
              row['title'], row['paper_url'] = updates[old]
              row['checked_at'] = '2026-10-07'
              found.add(old)
          if found != set(updates):
              raise SystemExit(f'Missing paper targets: {sorted(set(updates) - found)}')

          tax_found = set()
          for row in taxonomy:
              if row['venue'] != 'ICCV' or row['year'] != '2019' or row['title'] not in updates:
                  continue
              old = row['title']
              row['title'] = updates[old][0]
              tax_found.add(old)
          if tax_found != set(updates):
              raise SystemExit(f'Missing taxonomy targets: {sorted(set(updates) - tax_found)}')

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, taxonomy, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill ICCV 2019 canonical paper URLs'
            git push
          fi
