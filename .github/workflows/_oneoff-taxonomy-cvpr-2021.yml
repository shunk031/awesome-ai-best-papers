name: One-off CVPR 2021 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit CVPR 2021 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Apply curated corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/papers/cvpr.csv')
          changes={
            ('2021','Binary TTC: A Temporal Geofence for Autonomous Navigation'):{
              'area':'Computer Vision','task':'Visual Recognition & Representation','model_family':'Neural Model'},
            ('2021','Task Programming: Learning Data Efficient Behavior Representations'):{
              'area':'General ML & Representation Learning','task':'Representation Learning','model_family':'Representation Learning'},
            ('2021','Exploring Simple Siamese Representation Learning'):{
              'model_family':'Representation Learning'},
          }
          with path.open(newline='',encoding='utf-8') as f:
            rows=list(csv.DictReader(f)); fields=list(rows[0])
          seen=set()
          for r in rows:
            k=(r['year'],r['title'])
            if k in changes:
              for field,val in changes[k].items():
                print(f'{k}: {field}: {r[field]} -> {val}'); r[field]=val
              seen.add(k)
          if seen != set(changes): raise RuntimeError(f'Missing targets: {set(changes)-seen}')
          with path.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint
      - name: Commit audit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/cvpr.csv README.md
          git commit -m "Audit CVPR 2021 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
