name: One-off AAAI 2021 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2021-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill AAAI 2021 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Exploration-Exploitation in Multi-Agent Learning: Catastrophe Theory Meets Game Theory': 'https://ojs.aaai.org/index.php/AAAI/article/view/17343',
              'Informer: Beyond Efficient Transformer for Long Sequence Time-Series Forecasting': 'https://ojs.aaai.org/index.php/AAAI/article/view/17325',
              'Learning from eXtreme Bandit Feedback': 'https://ojs.aaai.org/index.php/AAAI/article/view/17058',
              'Self-Attention Attribution: Interpreting Information Interactions Inside Transformer': 'https://ojs.aaai.org/index.php/AAAI/article/view/17533',
              'Mitigating Political Bias in Language Models through Reinforced Calibration': 'https://ojs.aaai.org/index.php/AAAI/article/view/17744',
              'Dual-Mandate Patrols: Multi-Armed Bandits for Green Security': 'https://ojs.aaai.org/index.php/AAAI/article/view/17757',
              'IQ – Incremental Learning for Solving QSAT': 'https://www.aaai.org/AAAI21Papers/AAAI-7047.LeeT.pdf',
              'Ethically Compliant Sequential Decision Making': 'https://ojs.aaai.org/index.php/AAAI/article/view/17386',
              'On the Tractability of SHAP Explanations': 'https://ojs.aaai.org/index.php/AAAI/article/view/16806',
              'Expected Eligibility Traces': 'https://ojs.aaai.org/index.php/AAAI/article/view/17200',
              'Polynomial-Time Algorithms for Counting and Sampling Markov Equivalent DAGs': 'https://ojs.aaai.org/index.php/AAAI/article/view/17448',
              'Self-Supervised Multi-View Stereo via Effective Co-Segmentation and Data-Augmentation': 'https://ojs.aaai.org/index.php/AAAI/article/view/16411',
          }
          folded = {k.casefold(): v for k, v in urls.items()}

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          found = set()
          for row in rows:
              if row['venue'] != 'AAAI' or row['year'] != '2021':
                  continue
              key = row['title'].casefold()
              if key not in folded:
                  continue
              canonical = folded[key]
              if row['paper_url'] not in ('', canonical):
                  raise SystemExit(f'Unexpected existing URL for {row["title"]}: {row["paper_url"]}')
              row['paper_url'] = canonical
              row['checked_at'] = '2026-10-07'
              found.add(key)

          missing = set(folded) - found
          if missing:
              raise SystemExit(f'Missing target rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill AAAI 2021 canonical paper URLs'
            git push
          fi
