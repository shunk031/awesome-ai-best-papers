name: One-off CVPR 2016-2017 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-cvpr-2016-2017-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill CVPR 2016-2017 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')

          updates = {
              ('2017', 'Densely Connected Convolutional Networks'): (
                  'Densely Connected Convolutional Networks',
                  'https://openaccess.thecvf.com/content_cvpr_2017/html/Huang_Densely_Connected_Convolutional_CVPR_2017_paper.html',
              ),
              ('2017', 'Learning from Simulated and Unsupervised Images through Adversarial Training'): (
                  'Learning from Simulated and Unsupervised Images through Adversarial Training',
                  'https://openaccess.thecvf.com/content_cvpr_2017/html/Shrivastava_Learning_From_Simulated_CVPR_2017_paper.html',
              ),
              ('2017', 'Annotating Object Instances with a Polygon-RNN.'): (
                  'Annotating Object Instances With a Polygon-RNN',
                  'https://openaccess.thecvf.com/content_cvpr_2017/html/Castrejon_Annotating_Object_Instances_CVPR_2017_paper.html',
              ),
              ('2017', 'YOLO9000: Better, Faster, Stronger.'): (
                  'YOLO9000: Better, Faster, Stronger',
                  'https://openaccess.thecvf.com/content_cvpr_2017/html/Redmon_YOLO9000_Better_Faster_CVPR_2017_paper.html',
              ),
              ('2017', 'Computational Imaging on the Electric Grid.'): (
                  'Computational Imaging on the Electric Grid',
                  'https://openaccess.thecvf.com/content_cvpr_2017/html/Sheinin_Computational_Imaging_on_CVPR_2017_paper.html',
              ),
              ('2016', 'Deep Residual Learning for Image Recognition'): (
                  'Deep Residual Learning for Image Recognition',
                  'https://openaccess.thecvf.com/content_cvpr_2016/html/He_Deep_Residual_Learning_CVPR_2016_paper.html',
              ),
              ('2016', 'Sublabel-Accurate Relaxation of Nonconvex Energies'): (
                  'Sublabel-Accurate Relaxation of Nonconvex Energies',
                  'https://openaccess.thecvf.com/content_cvpr_2016/html/Mollenhoff_Sublabel-Accurate_Relaxation_of_CVPR_2016_paper.html',
              ),
              ('2016', 'Structural-RNN: Deep Learning on Spatio-Temporal Graphs.'): (
                  'Structural-RNN: Deep Learning on Spatio-Temporal Graphs',
                  'https://openaccess.thecvf.com/content_cvpr_2016/papers/Jain_Structural-RNN_Deep_Learning_CVPR_2016_paper.pdf',
              ),
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          papers = read(papers_path)
          taxonomy = read(taxonomy_path)
          found = set()

          for row in papers:
              if row['venue'] != 'CVPR':
                  continue
              key = (row['year'], row['title'])
              if key not in updates:
                  continue
              new_title, url = updates[key]
              row['title'] = new_title
              row['paper_url'] = url
              row['checked_at'] = '2026-10-07'
              found.add(key)

          if found != set(updates):
              raise SystemExit(f'Missing paper targets: {sorted(set(updates) - found)}')

          tax_found = set()
          for row in taxonomy:
              if row['venue'] != 'CVPR':
                  continue
              key = (row['year'], row['title'])
              if key not in updates:
                  continue
              new_title, _ = updates[key]
              row['title'] = new_title
              tax_found.add(key)

          if tax_found != set(updates):
              raise SystemExit(f'Missing taxonomy targets: {sorted(set(updates) - tax_found)}')

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, taxonomy, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill CVPR 2016-2017 canonical paper URLs'
            git push
          fi
