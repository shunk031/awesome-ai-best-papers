name: Vision Backfill

on:
  push:
    branches:
      - catalog/historical-vision-2010-2015

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: catalog/historical-vision-2010-2015

      - name: Append verified historical Vision awards
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          rows = {
              Path("data/papers/cvpr.csv"): [
                  ["CVPR","2015","Best Paper","primary","DynamicFusion: Reconstruction and Tracking of Non-Rigid Scenes in Real-Time","https://openaccess.thecvf.com/content_cvpr_2015/html/Newcombe_DynamicFusion_Reconstruction_and_2015_CVPR_paper.html","https://cvpr2015.thecvf.com/awards.php","2026-10-08","Computer Vision","3D Vision & Reconstruction","Classical / Optimization",""],
                  ["CVPR","2015","Best Paper Honorable Mention","secondary","Efficient Globally Optimal Consensus Maximisation With Tree Search","https://openaccess.thecvf.com/content_cvpr_2015/html/Chin_Efficient_Globally_Optimal_2015_CVPR_paper.html","https://cvpr2015.thecvf.com/awards.php","2026-10-08","Computer Vision","Optimization & Generalization","Search / Planning; Optimization",""],
                  ["CVPR","2015","Best Paper Honorable Mention","secondary","Fully Convolutional Networks for Semantic Segmentation","https://openaccess.thecvf.com/content_cvpr_2015/html/Long_Fully_Convolutional_Networks_2015_CVPR_paper.html","https://cvpr2015.thecvf.com/awards.php","2026-10-08","Computer Vision","Visual Recognition & Representation","CNN",""],
                  ["CVPR","2015","Best Paper Honorable Mention","secondary","Picture: A Probabilistic Programming Language for Scene Perception","https://openaccess.thecvf.com/content_cvpr_2015/papers/Kulkarni_Picture_A_Probabilistic_2015_CVPR_paper.pdf","https://cvpr2015.thecvf.com/awards.php","2026-10-08","Computer Vision","Probabilistic Inference & Sampling","Probabilistic / Bayesian",""],
                  ["CVPR","2015","Best Student Paper","secondary","Category-Specific Object Reconstruction from a Single Image","https://openaccess.thecvf.com/content_cvpr_2015/papers/Kar_Category-Specific_Object_Reconstruction_2015_CVPR_paper.pdf","https://cvpr2015.thecvf.com/awards.php","2026-10-08","Computer Vision","3D Vision & Reconstruction","Classical / Optimization",""],
                  ["CVPR","2014","Best Paper","primary","What Camera Motion Reveals About Shape With Unknown BRDF","https://openaccess.thecvf.com/content_cvpr_2014/papers/Chandraker_What_Camera_Motion_2014_CVPR_paper.pdf","https://cvpr2014.thecvf.com/awards.php","2026-10-08","Computer Vision","3D Vision & Reconstruction","Theory / Analysis",""],
                  ["CVPR","2014","Best Paper Honorable Mention","secondary","3D Shape and Indirect Appearance by Structured Light Transport","https://openaccess.thecvf.com/content_cvpr_2014/html/OToole_3D_Shape_and_2014_CVPR_paper.html","https://cvpr2014.thecvf.com/awards.php","2026-10-08","Computer Vision","3D Vision & Reconstruction","Classical / Optimization",""],
                  ["CVPR","2014","Best Student Paper","secondary","Partial Optimality by Pruning for MAP-inference with General Graphical Models","https://openaccess.thecvf.com/content_cvpr_2014/papers/Swoboda_Partial_Optimality_by_2014_CVPR_paper.pdf","https://cvpr2014.thecvf.com/awards.php","2026-10-08","Graphs & Structured Learning","Graph & Structured Learning","Optimization",""],
                  ["CVPR","2013","Best Paper","primary","Fast, Accurate Detection of 100,000 Object Classes on a Single Machine","https://openaccess.thecvf.com/content_cvpr_2013/html/Dean_Fast_Accurate_Detection_2013_CVPR_paper.html","https://cvpr2013.thecvf.com/awards.php","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["CVPR","2013","Best Paper Runner-Up","secondary","Lost! Leveraging the Crowd for Probabilistic Visual Self-Localization","https://openaccess.thecvf.com/content_cvpr_2013/html/Brubaker_Lost_Leveraging_the_2013_CVPR_paper.html","https://cvpr2013.thecvf.com/awards.php","2026-10-08","Computer Vision","3D Vision & Reconstruction","Probabilistic / Bayesian",""],
                  ["CVPR","2013","Best Student Paper","secondary","Discriminative Non-blind Deblurring","https://openaccess.thecvf.com/content_cvpr_2013/html/Schmidt_Discriminative_Non-blind_Deblurring_2013_CVPR_paper.html","https://cvpr2013.thecvf.com/awards.php","2026-10-08","Computer Vision","Image & Video Generation","Probabilistic / Bayesian",""],
                  ["CVPR","2012","Best Paper","primary","A Simple Prior-free Method for Non-Rigid Structure-from-Motion Factorization","https://doi.org/10.1109/CVPR.2012.6247905","https://tc.computer.org/tcpami/awards/cvpr-paper-awards/","2026-10-08","Computer Vision","3D Vision & Reconstruction","Optimization",""],
                  ["CVPR","2012","Best Student Paper","secondary","Max-Margin Early Event Detectors","https://doi.org/10.1109/CVPR.2012.6248012","https://tc.computer.org/tcpami/awards/cvpr-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["CVPR","2011","Best Paper","primary","Real-time Human Pose Recognition in Parts from Single Depth Images","https://doi.org/10.1109/CVPR.2011.5995316","https://cvpr2011.org/index.html","2026-10-08","Computer Vision","3D Vision & Reconstruction","Classical / Optimization",""],
                  ["CVPR","2011","Best Paper Honorable Mention","secondary","Discrete-Continuous Optimization for Large-scale Structure from Motion","https://doi.org/10.1109/CVPR.2011.5995626","https://cvpr2011.org/index.html","2026-10-08","Computer Vision","3D Vision & Reconstruction","Optimization",""],
                  ["CVPR","2011","Best Student Paper","secondary","Recognition Using Visual Phrases","https://doi.org/10.1109/CVPR.2011.5995711","https://cvpr2011.org/index.html","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["CVPR","2011","Best Student Paper Honorable Mention","secondary","Separating Reflective and Fluorescent Components of An Image","https://doi.org/10.1109/CVPR.2011.5995704","https://cvpr2011.org/index.html","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["CVPR","2010","Best Paper","primary","Efficient Computation of Robust Low-Rank Matrix Approximations in the Presence of Missing Data using the L1 Norm","https://doi.org/10.1109/CVPR.2010.5540139","https://tc.computer.org/tcpami/awards/cvpr-paper-awards/","2026-10-08","ML Theory & Optimization","Optimization & Generalization","Optimization",""],
                  ["CVPR","2010","Best Student Paper","secondary","Visual Event Recognition in Videos by Learning from Web Data","https://doi.org/10.1109/CVPR.2010.5539870","https://tc.computer.org/tcpami/awards/cvpr-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Kernel / NTK",""],
                  ["CVPR","2010","Best Student Paper Honorable Mention","secondary","Modeling Mutual Context of Object and Human Pose in Human-Object Interaction Activities","https://doi.org/10.1109/CVPR.2010.5540235","https://tc.computer.org/tcpami/awards/cvpr-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
              ],
              Path("data/papers/iccv.csv"): [
                  ["ICCV","2015","Marr Prize","primary","Deep Neural Decision Forests","https://openaccess.thecvf.com/content_iccv_2015/html/Kontschieder_Deep_Neural_Decision_ICCV_2015_paper.html","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","CNN",""],
                  ["ICCV","2015","Marr Prize Paper Honorable Mention","secondary","Holistically-Nested Edge Detection","https://openaccess.thecvf.com/content_iccv_2015/html/Xie_Holistically-Nested_Edge_Detection_ICCV_2015_paper.html","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","CNN",""],
                  ["ICCV","2013","Marr Prize","primary","From Large Scale Image Categorization to Entry-Level Categories","https://openaccess.thecvf.com/content_iccv_2013/html/Ordonez_From_Large_Scale_2013_ICCV_paper.html","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["ICCV","2013","Marr Prize Paper Honorable Mention","secondary","Hierarchical Data-Driven Descent for Efficient Optimal Deformation Estimation","https://openaccess.thecvf.com/content_iccv_2013/html/Tian_Hierarchical_Data-Driven_Descent_2013_ICCV_paper.html","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["ICCV","2013","Marr Prize Paper Honorable Mention","secondary","Piecewise Rigid Scene Flow","https://openaccess.thecvf.com/content_iccv_2013/html/Vogel_Piecewise_Rigid_Scene_2013_ICCV_paper.html","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","3D Vision & Reconstruction","Optimization",""],
                  ["ICCV","2011","Marr Prize","primary","Relative Attributes","https://doi.org/10.1109/ICCV.2011.6126281","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
                  ["ICCV","2011","Best Student Paper","secondary","Close the Loop: Joint Blind Image Restoration and Recognition with Sparse Representation Prior","https://doi.org/10.1109/ICCV.2011.6126315","https://tc.computer.org/tcpami/awards/iccv-paper-awards/","2026-10-08","Computer Vision","Visual Recognition & Representation","Classical / Optimization",""],
              ],
          }

          for path, additions in rows.items():
              existing = list(csv.DictReader(path.open(newline="", encoding="utf-8")))
              existing_keys = {(r["venue"], r["year"], r["award"], r["title"]) for r in existing}
              new_rows = [r for r in additions if (r[0], r[1], r[2], r[4]) not in existing_keys]
              with path.open("a", newline="", encoding="utf-8") as f:
                  writer = csv.writer(f, lineterminator="\n")
                  writer.writerows(new_rows)
              print(f"{path}: appended {len(new_rows)} rows")
          PY

      - name: Commit backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/cvpr.csv data/papers/iccv.csv
          git commit -m "Add historical Vision award papers (2010–2015)"
          git push origin HEAD:catalog/historical-vision-2010-2015
