name: One-off ICML URL audit

on:
  push:
    branches:
      - audit/icml-canonical-urls

permissions:
  contents: write

jobs:
  fill-icml-urls:
    if: ${{ !contains(github.event.head_commit.message, 'Fill canonical ICML paper URLs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/icml-canonical-urls
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply verified ICML paper URLs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          PAPERS = Path('data/papers.csv')
          TAXONOMY = Path('data/paper_taxonomy.csv')

          URLS = {
              (2025, 'CollabLLM: From Passive Responders to Active Collaborators'):
                  ('CollabLLM: From Passive Responders to Active Collaborators', 'https://proceedings.mlr.press/v267/wu25i.html'),
              (2025, 'Conformal Prediction as Bayesian Quadrature'):
                  ('Conformal Prediction as Bayesian Quadrature', 'https://proceedings.mlr.press/v267/snell25a.html'),
              (2025, 'Roll the dice & look before you leap: Going beyond the creative limits of next-token prediction'):
                  ('Roll the dice & look before you leap: Going beyond the creative limits of next-token prediction', 'https://proceedings.mlr.press/v267/nagarajan25a.html'),
              (2025, 'Score Matching with Missing Data'):
                  ('Score Matching with Missing Data', 'https://proceedings.mlr.press/v267/givens25a.html'),
              (2025, 'The Value of Prediction in Identifying the Worst-Off'):
                  ('The Value of Prediction in Identifying the Worst-Off', 'https://proceedings.mlr.press/v267/fischer-abaigar25a.html'),
              (2025, 'Train for the Worst, Plan for the Best: Understanding Token Ordering in Masked Diffusions'):
                  ('Train for the Worst, Plan for the Best: Understanding Token Ordering in Masked Diffusions', 'https://proceedings.mlr.press/v267/kim25ah.html'),
              (2018, 'Delayed Impact of Fair Machine Learning'):
                  ('Delayed Impact of Fair Machine Learning', 'https://proceedings.mlr.press/v80/liu18c.html'),
              (2018, 'Obfuscated Gradients Give a False Sense of Security: Circumventing Defenses to Adversarial Examples'):
                  ('Obfuscated Gradients Give a False Sense of Security: Circumventing Defenses to Adversarial Examples', 'https://proceedings.mlr.press/v80/athalye18a.html'),
              (2018, 'Fairness Without Demographics in Repeated Loss Minimization.'):
                  ('Fairness Without Demographics in Repeated Loss Minimization', 'https://proceedings.mlr.press/v80/hashimoto18a.html'),
              (2018, 'Near Optimal Frequent Directions for Sketching Dense and Sparse Matrices.'):
                  ('Near Optimal Frequent Directions for Sketching Dense and Sparse Matrices', 'https://proceedings.mlr.press/v80/huang18a.html'),
              (2018, 'The Mechanics of n-Player Differentiable Games.'):
                  ('The Mechanics of n-Player Differentiable Games', 'https://proceedings.mlr.press/v80/balduzzi18a.html'),
              (2017, 'Understanding Black-box Predictions via Influence Functions'):
                  ('Understanding Black-box Predictions via Influence Functions', 'https://proceedings.mlr.press/v70/koh17a.html'),
              (2017, 'A Unified Maximum Likelihood Approach for Estimating Symmetric Properties of Discrete Distributions.'):
                  ('A Unified Maximum Likelihood Approach for Estimating Symmetric Properties of Discrete Distributions', 'https://proceedings.mlr.press/v70/acharya17a.html'),
              (2017, 'Lost Relatives of the Gumbel Trick.'):
                  ('Lost Relatives of the Gumbel Trick', 'https://proceedings.mlr.press/v70/balog17a.html'),
              (2017, 'Modular Multitask Reinforcement Learning with Policy Sketches.'):
                  ('Modular Multitask Reinforcement Learning with Policy Sketches', 'https://proceedings.mlr.press/v70/andreas17a.html'),
              (2016, 'Dueling Network Architectures for Deep Reinforcement Learning'):
                  ('Dueling Network Architectures for Deep Reinforcement Learning', 'https://proceedings.mlr.press/v48/wangf16.html'),
              (2016, 'Ensuring Rapid Mixing and Low Bias for Asynchronous Gibbs Sampling'):
                  ('Ensuring Rapid Mixing and Low Bias for Asynchronous Gibbs Sampling', 'https://proceedings.mlr.press/v48/sa16.html'),
              (2016, 'Pixel Recurrent Neural Networks'):
                  ('Pixel Recurrent Neural Networks', 'https://proceedings.mlr.press/v48/oord16.html'),
          }

          with PAPERS.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())

          targets = [r for r in rows if r['venue'] == 'ICML' and not r['paper_url'].strip()]
          print(f'ICML missing before: {len(targets)}')
          if len(targets) != 18:
              raise RuntimeError(f'Expected 18 missing ICML URLs on audited base, found {len(targets)}')

          observed = {(int(r['year']), r['title']) for r in targets}
          expected = set(URLS)
          if observed != expected:
              raise RuntimeError(f'ICML mapping mismatch; missing={sorted(observed - expected)}; stale={sorted(expected - observed)}')

          title_changes = {}
          for r in targets:
              key = (int(r['year']), r['title'])
              new_title, url = URLS[key]
              if not url.startswith('https://proceedings.mlr.press/'):
                  raise RuntimeError(f'Expected PMLR URL for {key}: {url}')
              if new_title != r['title']:
                  title_changes[(r['venue'], r['year'], r['title'])] = new_title
              r['title'] = new_title
              r['paper_url'] = url
              print(f"{r['year']} | {r['title']} -> {url}")

          with PAPERS.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(rows)

          with TAXONOMY.open(newline='', encoding='utf-8') as f:
              tax_rows = list(csv.DictReader(f))
              tax_fields = list(tax_rows[0].keys())
          changed_tax = 0
          for r in tax_rows:
              key = (r['venue'], r['year'], r['title'])
              if key in title_changes:
                  r['title'] = title_changes[key]
                  changed_tax += 1
          if changed_tax != len(title_changes) or changed_tax != 6:
              raise RuntimeError(f'Expected exactly six taxonomy title punctuation updates, got {changed_tax}')
          with TAXONOMY.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=tax_fields, lineterminator='\n')
              w.writeheader()
              w.writerows(tax_rows)

          with PAPERS.open(newline='', encoding='utf-8') as f:
              after = list(csv.DictReader(f))
          remaining = [r for r in after if r['venue'] == 'ICML' and not r['paper_url'].strip()]
          if remaining:
              raise RuntimeError(f'ICML missing URLs remain: {len(remaining)}')
          print(f'ICML missing after: {len(remaining)}')
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check

      - name: Commit audited data
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.csv data/paper_taxonomy.csv README.md
          git commit -m "Fill canonical ICML paper URLs"
          git push origin HEAD:audit/icml-canonical-urls
