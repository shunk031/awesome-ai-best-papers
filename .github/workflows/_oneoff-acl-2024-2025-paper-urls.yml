name: One-off ACL 2024-2025 canonical paper URLs

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-acl-2024-2025-paper-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - name: Fill ACL 2024-2025 canonical paper URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              ('2025', 'A Theory of Response Sampling in LLMs: Part Descriptive and Part Prescriptive'): 'https://aclanthology.org/2025.acl-long.1454/',
              ('2025', 'Fairness through Difference Awareness: Measuring Desired Group Discrimination in LLMs'): 'https://aclanthology.org/2025.acl-long.341/',
              ('2025', 'Language Models Resist Alignment: Evidence From Data Compression'): 'https://aclanthology.org/2025.acl-long.1141/',
              ('2025', 'Native Sparse Attention: Hardware-Aligned and Natively Trainable Sparse Attention'): 'https://aclanthology.org/2025.acl-long.1126/',
              ('2024', 'Aya Model: An Instruction Finetuned Open-Access Multilingual Language Model'): 'https://aclanthology.org/2024.acl-long.845/',
              ('2024', 'Causal Estimation of Memorisation Profiles'): 'https://aclanthology.org/2024.acl-long.834/',
              ('2024', 'Deciphering Oracle Bone Language with Diffusion Models'): 'https://aclanthology.org/2024.acl-long.831/',
              ('2024', 'Mission: Impossible Language Models'): 'https://aclanthology.org/2024.acl-long.787/',
              ('2024', 'Natural Language Satisfiability'): 'https://aclanthology.org/2024.acl-long.815/',
              ('2024', 'Semisupervised Neural Proto-Language Reconstruction'): 'https://aclanthology.org/2024.acl-long.788/',
              ('2024', 'Why are Sensitive Functions Hard for Transformers?'): 'https://aclanthology.org/2024.acl-long.800/',
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())

          seen = set()
          changed = 0
          for row in rows:
              if row['venue'] != 'ACL':
                  continue
              key = (row['year'], row['title'])
              if key in urls:
                  seen.add(key)
                  if row['paper_url'] != urls[key]:
                      row['paper_url'] = urls[key]
                      row['checked_at'] = '2026-10-07'
                      changed += 1

          missing = set(urls) - seen
          if missing:
              raise SystemExit(f'Expected ACL records not found: {sorted(missing)}')
          print(f'Updated {changed} ACL canonical paper URLs; matched {len(seen)} records.')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          subprocess.run(['uv', 'run', 'python', 'scripts/validate_catalog.py'], check=True)
          subprocess.run(['uv', 'run', 'python', 'scripts/generate_readme.py'], check=True)
          subprocess.run(['uv', 'run', 'python', 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add ACL 2024-2025 canonical paper URLs'
            git push
          fi
