name: One-off ICCV award audit

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-iccv-audit.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add missing ICCV student and honorable mention awards
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')
          source = 'https://www.thecvf.com/?page_id=413'

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          additions = [
              ('2025','Best Student Paper','FlowEdit: Inversion-Free Text-Based Editing Using Pre-Trained Flow Models','Computer Vision','Image & Video Generation','Neural Model'),
              ('2025','Marr Prize Paper Honorable Mention','Spatially-Varying Autofocus','Computer Vision','3D Vision & Reconstruction','Classical / Optimization'),
              ('2025','Marr Prize Paper Honorable Mention','RayZer: A Self-supervised Large View Synthesis Model','Computer Vision','3D Vision & Reconstruction','Neural Model'),

              ('2023','Best Student Paper','Tracking Everything Everywhere All at Once','Computer Vision','Visual Recognition & Representation','Neural Model'),
              ('2023','Marr Prize Paper Honorable Mention','Segment Anything','Computer Vision','Visual Recognition & Representation','Transformer'),

              ('2021','Best Student Paper','Pixel-Perfect Structure-from-Motion with Featuremetric Refinement','Computer Vision','3D Vision & Reconstruction','Optimization; Neural Model'),
              ('2021','Marr Prize Paper Honorable Mention','Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields','Computer Vision','3D Vision & Reconstruction','Neural Model'),
              ('2021','Marr Prize Paper Honorable Mention','OpenGAN: Open-Set Recognition via Open Data Generation','Computer Vision','Visual Recognition & Representation','GAN'),
              ('2021','Marr Prize Paper Honorable Mention','Viewing Graph Solvability via Cycle Consistency','Computer Vision','3D Vision & Reconstruction','Theory / Analysis'),
              ('2021','Marr Prize Paper Honorable Mention','Common Objects in 3D: LargeScale Learning and Evaluation of Real-life 3D Category Reconstruction','Computer Vision','3D Vision & Reconstruction','Neural Model'),

              ('2019','Best Student Paper','PLMP – Point-Line Minimal Problems in Complete Multi-View Visibility','Computer Vision','3D Vision & Reconstruction','Theory / Analysis'),
              ('2019','Marr Prize Paper Honorable Mention','Asynchronous Single-Photon 3D Imaging','Computer Vision','3D Vision & Reconstruction','Classical / Optimization'),
              ('2019','Marr Prize Paper Honorable Mention','Specifying Object Attributes and Relations in Interactive Scene Generation','Computer Vision','Generative Modeling','Neural Model'),
          ]

          papers = read(papers_path)
          tax = read(taxonomy_path)
          paper_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in papers}
          tax_keys = {(r['venue'], r['year'], r['title'].casefold()) for r in tax}

          for year, award, title, area, task, family in additions:
              key = ('ICCV', year, title.casefold())
              if key not in paper_keys:
                  row = {'venue':'ICCV','year':year,'award':award,'tier':'secondary','title':title,'paper_url':'','source_url':source,'checked_at':'2026-10-07','notes':''}
                  insert_at = max(i for i,r in enumerate(papers) if r['venue']=='ICCV' and r['year']==year) + 1
                  papers.insert(insert_at, row)
                  paper_keys.add(key)
              if key not in tax_keys:
                  row = {'venue':'ICCV','year':year,'title':title,'area':area,'task':task,'model_family':family}
                  insert_at = max(i for i,r in enumerate(tax) if r['venue']=='ICCV' and r['year']==year) + 1
                  tax.insert(insert_at, row)
                  tax_keys.add(key)

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, tax, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit audited catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Complete recent ICCV paper awards'
            git push
          fi
