name: One-off EMNLP 2023 Outstanding URLs 01

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-emnlp-2023-outstanding-01.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill EMNLP 2023 Outstanding canonical URLs batch 01
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          papers_path = Path('data/papers.csv')
          taxonomy_path = Path('data/paper_taxonomy.csv')
          updates = {
              'Background Summarization of Event Timelines': (
                  'Background Summarization of Event Timelines',
                  'https://aclanthology.org/2023.emnlp-main.505/',
              ),
              'Bridging Continuous and Discrete Spaces: Interpretable Sentence Representation Learning via Compositional Operations': (
                  'Bridging Continuous and Discrete Spaces: Interpretable Sentence Representation Learning via Compositional Operations',
                  'https://aclanthology.org/2023.emnlp-main.900/',
              ),
              'Counter Turing Test (CT2): AI-Generated Text Detection is Not as Easy as You May Think - Introducing AI Detectability Index (ADI)': (
                  'Counter Turing Test (CT²): AI-Generated Text Detection is Not as Easy as You May Think - Introducing AI Detectability Index',
                  'https://aclanthology.org/2023.emnlp-main.136/',
              ),
              'Cross-Lingual Consistency of Factual Knowledge in Multilingual Language Models': (
                  'Cross-Lingual Consistency of Factual Knowledge in Multilingual Language Models',
                  'https://aclanthology.org/2023.emnlp-main.658/',
              ),
              'FedID: Federated Interactive Distillation for Large-Scale Pretraining Language Models': (
                  'FedID: Federated Interactive Distillation for Large-Scale Pretraining Language Models',
                  'https://aclanthology.org/2023.emnlp-main.529/',
              ),
          }

          def read(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          def write(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader(); writer.writerows(rows)

          papers = read(papers_path)
          taxonomy = read(taxonomy_path)
          found = set()
          for row in papers:
              if row['venue'] != 'EMNLP' or row['year'] != '2023' or row['award'] != 'Outstanding Paper' or row['title'] not in updates:
                  continue
              old = row['title']
              row['title'], row['paper_url'] = updates[old]
              row['checked_at'] = '2026-10-07'
              found.add(old)
          if found != set(updates):
              raise SystemExit(f'Missing paper targets: {sorted(set(updates)-found)}')

          tax_found = set()
          for row in taxonomy:
              if row['venue'] != 'EMNLP' or row['year'] != '2023' or row['title'] not in updates:
                  continue
              old = row['title']
              row['title'] = updates[old][0]
              tax_found.add(old)
          if tax_found != set(updates):
              raise SystemExit(f'Missing taxonomy targets: {sorted(set(updates)-tax_found)}')

          write(papers_path, papers, ['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'])
          write(taxonomy_path, taxonomy, ['venue','year','title','area','task','model_family'])
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill EMNLP 2023 Outstanding canonical URLs batch 01'
            git push
          fi
