name: One-off EMNLP 2024-2025 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit EMNLP 2024-2025 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply curated taxonomy correction
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/papers/emnlp.csv')
          title = 'Pretraining Data Detection for Large Language Models: A Divergence-based Calibration Method'
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0])

          matches = [r for r in rows if r['year'] == '2024' and r['title'] == title]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one target row, found {len(matches)}')
          row = matches[0]
          print(f'model_family: {row["model_family"]} -> LLM; Transformer')
          row['model_family'] = 'LLM; Transformer'

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint

      - name: Commit taxonomy audit
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/emnlp.csv README.md
          git commit -m "Audit EMNLP 2024-2025 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
