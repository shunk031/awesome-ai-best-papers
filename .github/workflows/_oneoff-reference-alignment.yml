name: One-off reference-structure alignment

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-reference-alignment.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lock and sync maintenance environment
        run: |
          uv lock
          uv sync

      - name: Regenerate and validate README
        run: |
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check

      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md uv.lock
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Regenerate README from Jinja template'
            git push
          fi
