name: One-off BiGGen taxonomy correction

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-biggen-taxonomy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/data-driven-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct BiGGen Bench task taxonomy
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/paper_taxonomy.csv')
          title = 'The BiGGen Bench: A Principled Benchmark for Fine-grained Evaluation of Language Models with Language Models'
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          matched = 0
          for row in rows:
              if row['venue']=='NAACL' and row['year']=='2025' and row['title']==title:
                  row['task'] = 'LLM Analysis & Evaluation'
                  matched += 1
          if matched != 1:
              raise SystemExit(f'Expected one BiGGen taxonomy row, found {matched}')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','title','area','task','model_family'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit taxonomy correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper_taxonomy.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Correct BiGGen Bench taxonomy'
            git push
          fi
