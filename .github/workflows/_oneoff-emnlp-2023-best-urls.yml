name: One-off EMNLP 2023 Best Paper URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-emnlp-2023-best-urls.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Fill EMNLP 2023 Best Paper canonical URLs
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          urls = {
              'Faster Minimum Bayes Risk Decoding with Confidence-based Pruning': 'https://aclanthology.org/2023.emnlp-main.767/',
              'Ignore This Title and HackAPrompt: Exposing Systemic Vulnerabilities of LLMs Through a Global Prompt Hacking Competition': 'https://aclanthology.org/2023.emnlp-main.302/',
              'Label Words are Anchors: An Information Flow Perspective for Understanding In-Context Learning': 'https://aclanthology.org/2023.emnlp-main.609/',
              'PaperMage: A Unified Toolkit for Processing, Representing, and Manipulating Visually-Rich Scientific Documents': 'https://aclanthology.org/2023.emnlp-demo.45/',
              'Personalized Dense Retrieval on Global Index for Voice-enabled Conversational Systems': 'https://aclanthology.org/2023.emnlp-industry.9/',
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          found = set()
          for row in rows:
              if row['venue'] == 'EMNLP' and row['year'] == '2023' and row['award'] == 'Best Paper' and row['title'] in urls:
                  row['paper_url'] = urls[row['title']]
                  row['checked_at'] = '2026-10-07'
                  found.add(row['title'])
          if found != set(urls):
              raise SystemExit(f'Missing targets: {sorted(set(urls)-found)}')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill EMNLP 2023 Best Paper canonical URLs'
            git push
          fi
