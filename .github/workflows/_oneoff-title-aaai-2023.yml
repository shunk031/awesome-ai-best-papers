name: One-off AAAI 2023 title audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-title:
    if: ${{ !contains(github.event.head_commit.message, 'Audit AAAI 2023 title') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Apply canonical AAAI title
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/papers/aaai.csv')
          old='CowClip: Reducing CTR Prediction Model Training Time from 12 hours to 10 minutes on 1 GPU'
          new='CowClip: Reducing CTR Prediction Model Training Time from 12 Hours to 10 Minutes on 1 GPU'
          with path.open(newline='',encoding='utf-8') as f:
            rows=list(csv.DictReader(f)); fields=list(rows[0])
          matches=[r for r in rows if r['year']=='2023' and r['title']==old]
          if len(matches)!=1: raise RuntimeError(f'Expected one target, found {len(matches)}')
          matches[0]['title']=new
          print(f'{old} -> {new}')
          with path.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint
      - name: Commit audit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/aaai.csv README.md
          git commit -m "Audit AAAI 2023 title"
          git push origin HEAD:refactor/venue-csv-catalog
