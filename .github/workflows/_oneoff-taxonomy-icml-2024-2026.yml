name: One-off ICML 2024-2026 taxonomy audit

on:
  push:
    branches:
      - refactor/venue-csv-catalog

permissions:
  contents: write

jobs:
  audit-taxonomy:
    if: ${{ !contains(github.event.head_commit.message, 'Audit ICML 2024-2026 taxonomy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/venue-csv-catalog
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply curated taxonomy corrections
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/papers/icml.csv')
          changes = {
              ('2026', 'High-Accuracy Sampling for Diffusion Models and Log-Concave Distributions'): {
                  'model_family': 'Diffusion; Probabilistic / Bayesian; Theory / Analysis',
              },
              ('2026', 'The Flexibility Trap: Rethinking the Value of Arbitrary Order in Diffusion Language Models'): {
                  'area': 'NLP & Language',
                  'model_family': 'LLM; Diffusion; RL',
              },
              ('2026', 'Motion Attribution for Video Generation'): {
                  'model_family': 'Diffusion',
              },
              ('2025', 'CollabLLM: From Passive Responders to Active Collaborators'): {
                  'model_family': 'LLM; Transformer; RL',
              },
              ('2025', 'Roll the dice & look before you leap: Going beyond the creative limits of next-token prediction'): {
                  'task': 'LLM Analysis & Evaluation',
                  'model_family': 'LLM; Diffusion; Autoregressive',
              },
              ('2025', 'Train for the Worst, Plan for the Best: Understanding Token Ordering in Masked Diffusions'): {
                  'model_family': 'Diffusion; Theory / Analysis',
              },
              ('2024', 'Genie: Generative Interactive Environments'): {
                  'task': 'Image & Video Generation',
                  'model_family': 'Autoregressive; Transformer',
              },
          }

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0])

          seen = set()
          for row in rows:
              key = (row['year'], row['title'])
              if key not in changes:
                  continue
              for field, value in changes[key].items():
                  print(f'{key}: {field}: {row[field]} -> {value}')
                  row[field] = value
              seen.add(key)

          missing = set(changes) - seen
          if missing:
              raise RuntimeError(f'Missing target rows: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate and regenerate
        run: |
          uv sync
          uv run python scripts/validate_catalog.py
          uv run python scripts/generate_readme.py
          uv run python scripts/generate_readme.py --check
          npx awesome-lint

      - name: Commit taxonomy audit
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers/icml.csv README.md
          git commit -m "Audit ICML 2024-2026 taxonomy"
          git push origin HEAD:refactor/venue-csv-catalog
