name: One-off AAAI 2024 canonical URL fill

on:
  push:
    branches:
      - revamp/data-driven-catalog
    paths:
      - .github/workflows/_oneoff-aaai-2024-url.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/data-driven-catalog
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Fill AAAI 2024 canonical paper URL
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess, sys

          path = Path('data/papers.csv')
          title = 'Is My Prediction Arbitrary? The Confounding Effects of Variance in Fair Classification Benchmarks'
          canonical = 'https://ojs.aaai.org/index.php/AAAI/article/view/30203'

          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          matches = [r for r in rows if r['venue']=='AAAI' and r['year']=='2024' and r['title'].casefold()==title.casefold()]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one target row, found {len(matches)}')
          row = matches[0]
          if row['paper_url'] not in ('', canonical):
              raise SystemExit(f'Unexpected existing paper_url: {row["paper_url"]}')
          row['paper_url'] = canonical
          row['checked_at'] = '2026-10-07'

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['venue','year','award','tier','title','paper_url','source_url','checked_at','notes'], lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          subprocess.run([sys.executable, 'scripts/validate_catalog.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py'], check=True)
          subprocess.run([sys.executable, 'scripts/generate_readme.py', '--check'], check=True)
          PY
      - name: Commit canonical URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.csv README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fill AAAI 2024 canonical paper URL'
            git push
          fi
